{% block scripts %}
<script>
  function getCurrentTimestamp() {
    const now = new Date();
    return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  // Make URLs clickable (including plain http/https links)
  function formatURLs(text) {
    if (!text) return "";

    // Markdown: [label](https://url)
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function(_, label, url) {
      return `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    });

    // Plain URLs: https://example.com/anything
    text = text.replace(/(https?:\/\/[^\s]+)/g, function(url) {
      return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
    });

    return text;
  }

  window.onload = () => {
    // reserved if you want a greeting later
  };

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const message = input.value.trim();
    if (!message) return;

    const messagesDiv = document.getElementById('messages');

    // Show user message
    const timestamp = getCurrentTimestamp();
    messagesDiv.innerHTML += `
      <div class="message">
        <span class="user">You:</span> ${message}
        <span class="timestamp">${timestamp}</span>
      </div>`;
    input.value = "";

    // Show typing indicator
    const typingId = "typing-indicator";
    messagesDiv.innerHTML += `
      <div class="message" id="${typingId}">
        <span class="bruno">
          <img src="{{ url_for('static', filename='bruno-avatar.png') }}" alt="Bruno Avatar" class="bruno-avatar">
        </span>
        <img src="{{ url_for('static', filename='icons/typing-dots.svg') }}" alt="typing..." style="vertical-align: middle; height: 18px;">
      </div>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });

      const data = await response.json();
      const rawReply = data.reply || "Brun didn’t respond. Please try again.";
      const reply = formatURLs(rawReply);

      // Remove typing indicator
      const typingEl = document.getElementById(typingId);
      if (typingEl) typingEl.remove();

      const replyTimestamp = getCurrentTimestamp();
      messagesDiv.innerHTML += `
        <div class="message">
          <span class="bruno">
            <img src="{{ url_for('static', filename='bruno-avatar.png') }}" alt="Bruno Avatar" class="bruno-avatar">
          </span>
          ${reply}
          <span class="timestamp">${replyTimestamp}</span>
        </div>`;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    } catch (error) {
      const typingEl = document.getElementById(typingId);
      if (typingEl) typingEl.remove();

      messagesDiv.innerHTML += `
        <div class="message">
          <span class="bruno">
            <img src="{{ url_for('static', filename='bruno-avatar.png') }}" alt="Bruno Avatar" class="bruno-avatar">
          </span>
          Sorry, something went wrong.
        </div>`;
      console.error("Fetch error:", error);
    }
  }

  // Enter key sends message
  document.addEventListener("DOMContentLoaded", function() {
    const inputEl = document.getElementById('userInput');
    inputEl.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    // Hide avatar overlay and show chat area on click
    const avatarOverlay = document.getElementById('avatar-overlay');
    const chatArea = document.getElementById('chat-area');
    const avatarImg = document.getElementById('avatar-img');
    avatarImg.addEventListener('click', function() {
      avatarOverlay.style.display = 'none';
      chatArea.style.display = 'flex';

      const messagesDiv = document.getElementById('messages');
      const timestamp = getCurrentTimestamp();
      messagesDiv.innerHTML += `
        <div class="message">
          <span class="bruno">
            <img src="{{ url_for('static', filename='bruno-avatar.png') }}" alt="Bruno Avatar" class="bruno-avatar">
          </span>
          Hello, I'm Brun. How can I help today?
          <span class="timestamp">${timestamp}</span>
        </div>`;
    });
  });
</script>
{% endblock %}
